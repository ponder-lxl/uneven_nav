grid_map_filters:
  ros__parameters:

    input_topic: /elevation_map   
    output_topic: /traversability_map

    filters:
      
      filter1:  # Normalize buffer.
        name: buffer_normalizer
        type: gridMapFilters/BufferNormalizerFilter

      filter2:  # Delete color layer.
        name: delete_original_layers
        type: gridMapFilters/DeletionFilter
        params: 
          layers: [color] # List of layers.

      filter3:   # Fill holes in the map with inpainting.
        name: inpaint
        type: gridMapCv/InpaintFilter
        params:
          input_layer: elevation
          output_layer: elevation_inpainted
          radius: 0.32

      filter4:  # Compute Surface normals
        name: surface_normals
        type: gridMapFilters/NormalVectorsFilter
        params:
          input_layer: elevation
          output_layers_prefix: normal_vectors_
          algorithm: "area"
          radius: 0.3
          normal_vector_positive_axis: z
          parallelization_enabled: true
          thread_number: -1

      filter5:  # Compute slope from surface normal.
        name: slope
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: slope
          expression: acos(normal_vectors_z)

      filter6:  # Reduce noise with a radial blurring filter.
        name: mean_in_radius
        type: gridMapFilters/MeanInRadiusFilter
        params:
          input_layer: elevation_inpainted
          output_layer: elevation_smooth
          radius: 0.3

      filter7:  # Compute roughness as absolute difference from map to smoothened map.
        name: roughness
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: roughness
          expression: abs(elevation_inpainted - elevation_smooth)

      # Local height discontinuity (step): max-min elevation inside a sliding window.
      # Approximates ETH StepFilter's first-pass step_height without extra packages.
      filter8:
        name: step_height
        type: gridMapFilters/SlidingWindowMathExpressionFilter
        params:
          input_layer: elevation_inpainted
          output_layer: step_height
          expression: maxOfFinites(elevation_inpainted) - minOfFinites(elevation_inpainted)
          compute_empty_cells: false
          edge_handling: crop
          window_length: 0.3  # ~3 cells at 0.1 m resolution

      # Normalize step height to [0,1] traversability (1 = flat / safe).
      # critical_value 0.12 m matches scout test.yaml StepFilter setting.
      filter9:
        name: step
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: step
          expression: 1.0 - (step_height / 0.12)

      filter10:  # Clamp step traversability to [0,1].
        name: step_lower_threshold
        type: gridMapFilters/ThresholdFilter
        params:
          layer: step
          lower_threshold: 0.0
          set_to: 0.0

      filter11:
        name: step_upper_threshold
        type: gridMapFilters/ThresholdFilter
        params:
          layer: step
          upper_threshold: 1.0
          set_to: 1.0

      filter12:  # Traversability from slope, roughness, and step.
        name: traversability
        type: gridMapFilters/MathExpressionFilter
        params:
          output_layer: traversability
          # Weights: slope 0.55, roughness 0.15, step 0.30 (step is safety-critical for wheeled robots).
          expression: 0.55 * (1.0 - (slope / 0.65)) + 0.15 * (1.0 - (roughness / 0.25)) + 0.30 * step
          # previous (no step): 0.8 * (1.0 - (slope / 0.65)) + 0.2 * (1.0 - (roughness / 0.25))
          #moon expression: 0.8 * (1.0 - (slope / 0.65)) + 0.2 * (1.0 - (roughness / 0.25))
          #local expression: 0.8 * (1.0 - (slope / 0.9)) + 0.2 * (1.0 - (roughness / 0.25))

      filter13:  # Set lower threshold on traversability.
        name: traversability_lower_threshold
        type: gridMapFilters/ThresholdFilter
        params:
          layer: traversability
          lower_threshold: 0.0
          set_to: 0.0

      filter14:  # Set upper threshold on traversability.
        name: traversability_upper_threshold
        type: gridMapFilters/ThresholdFilter
        params:
          layer: traversability
          upper_threshold: 1.0
          set_to: 1.0 # Other uses: .nan, .inf



